<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="copertina" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AF52DE"/>
      <stop offset="0.5" stop-color="#FF2D55"/>
      <stop offset="1" stop-color="#FF9500"/>
    </linearGradient>
  </defs>
  <!-- Copertina circolare, concentrica con l'estremità sinistra della capsula
       (stesso margine sopra, sotto e a sinistra, come nell'isola). -->
  <circle cx="276" cy="512" r="82" fill="url(#copertina)"/>
  <!-- Equalizzatore a destra, con un margine un po' più ampio. -->
  <rect x="616" y="462" width="30" height="100" rx="15" fill="#30D158"/>
  <rect x="662" y="427" width="30" height="170" rx="15" fill="#30D158"/>
  <rect x="708" y="452" width="30" height="120" rx="15" fill="#30D158"/>
  <rect x="754" y="477" width="30" height="70" rx="15" fill="#30D158"/>
</svg>
